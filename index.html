<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantLab</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0f14;--p:#121923;--b:#223044;--t:#e6edf3;--m:#8b98a9;--g:#22c55e;--r:#ef4444;--a:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;display:grid;grid-template-columns:410px 1fr;height:100vh}
aside{background:var(--p);border-right:1px solid var(--b);overflow:auto;padding:14px}main{overflow:auto;padding:16px}
@media(max-width:900px){body{display:block;height:auto}}
h1{font-size:18px;margin:0 0 10px}h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--m);margin:16px 0 6px}
input,select,button{background:#0d141d;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer}button.pri{background:var(--a);border-color:var(--a);font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.row input{width:72px}.row select{max-width:125px}
.grp{border:1px solid var(--b);border-radius:8px;padding:8px;margin:8px 0}.gh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.risk{display:grid;grid-template-columns:1fr 1fr;gap:6px}.risk label{font-size:12px;color:var(--m)}.risk input{width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px}.card small{color:var(--m);display:block}.card b{font-size:18px}
.ch{height:330px;margin:12px 0;background:var(--p);border:1px solid var(--b);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid var(--b);text-align:right}th{color:var(--m);position:sticky;top:0;background:var(--p)}
.box{max-height:320px;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;margin:12px 0}
.pos{color:var(--g)}.neg{color:var(--r)}#msg{margin-top:8px;color:var(--m)}h2{font-size:14px;margin:18px 0 0}
#cl{max-height:200px;overflow:auto;font-size:13px;background:#0d141d;border:1px solid var(--b);border-radius:8px;padding:6px 10px}#cl p{margin:6px 0}#cl .u{color:#93c5fd}
.it{border:1px solid var(--b);border-radius:8px;padding:8px;margin:6px 0}.sub{color:var(--m);font-size:12px}.sub2{color:#6b7a8d;font-size:11px;margin:3px 0 4px;word-break:break-word}#tt.on,#th.on{background:var(--a);border-color:var(--a)}
</style></head><body>
<aside><h1>⚡ QuantLab</h1>
<select id=pre onchange="usePreset(this.value)"></select>
<h3>💬 Strategy chat</h3>
<div id=cl></div>
<div class=row><input id=ci style="flex:1;width:auto;min-width:140px" placeholder="e.g. long when ema 9 crosses above ema 21, sl 1% tp 2%" onkeydown="if(event.key==='Enter')chat()"><button class=pri onclick="chat()">Send</button></div>
<h3>📚 Library</h3>
<div class=row><button id=tt onclick="libTab('tpl')">⭐ Templates</button><button id=th onclick="libTab('hist')">🕘 History</button></div>
<div id=lib class=box style="padding:4px 8px;margin:6px 0"></div>
<div class=row><button onclick="tplSave()">★ Save template</button><button onclick="svExport()">Export current</button><button onclick="svBackup()">Backup all</button><button onclick="$('imp').click()">Import</button><button onclick="histClear()">Clear history</button><input id=imp type=file accept=".json,application/json" hidden onchange="svImport(this)"></div>
<h3>Market (Binance)</h3>
<div class=row><input id=sym list=sy value=BTCUSDT style="width:130px"><datalist id=sy></datalist><select id=tf></select><input id=n type=number value=3000 title="Candles (max 20000)"></div>
<h3>Direction</h3>
<select id=dir onchange="S.direction=this.value"><option value=long>Long only</option><option value=short>Short only</option><option value=both>Long + Short</option></select>
<h3>Rules (entry fills at next candle open)</h3><div id=G></div>
<h3>Risk &amp; costs</h3><div class=risk id=R></div><div class=risk id=R2 style="margin-top:6px"></div>
<h3>Optimizer</h3><div id=O></div>
<div class=row><button onclick="addOpt()">+ parameter</button>
<select id=met><option value=return_dd>Return / MaxDD</option><option value=return>Net return</option><option value=sharpe>Sharpe</option><option value=pf>Profit factor</option></select>
<input id=mt type=number value=10 title="Min trades"></div>
<h3>Monte Carlo</h3>
<div class=row><input id=mcn type=number value=1000 title="Simulations"><select id=mcm><option value=bootstrap>Resample trades</option><option value=shuffle>Shuffle order</option></select><button onclick="mc()">Run Monte Carlo</button></div>
<div class=row style="margin-top:14px"><button class=pri onclick="run()">Run backtest</button><button onclick="opt()">Optimize</button></div><div id=msg></div></aside>
<main><div class=cards id=cards></div><div class=ch id=pc></div><div class=ch id=ec style="height:220px"></div>
<div id=mcres></div><div id=ores></div><h2>Trades</h2><div class=box id=T></div></main>
<script>
const $=id=>document.getElementById(id);
const KINDS={close:0,open:0,high:0,low:0,volume:0,ema:1,sma:1,supertrend:1,vwap:0,adx:1,plus_di:1,minus_di:1,hh:1,ll:1,rsi:1,macd:0,macd_sig:0,stoch:1,cci:1,roc:1,atr:1,bb_up:1,bb_lo:1,body_pct:0,range_pct:0,vol_sma:1,or_high:3,or_low:3,vp_poc:1,vp_vah:1,vp_val:1,day_open:0,day_high:0,day_low:0,pw_high:0,pw_low:0,prev_high:0,prev_low:0,prev_close:0,pd_high:0,pd_low:0,pd_close:0,bull_candle:0,bear_candle:0,bull_engulf:0,bear_engulf:0,hammer:0,shooting_star:0,doji:0,inside_bar:0,hour:0,dow:0,num:2};
const KG={Price:['close','open','high','low','volume'],Trend:['ema','sma','supertrend','vwap','adx','plus_di','minus_di','hh','ll'],Momentum:['rsi','macd','macd_sig','stoch','cci','roc'],Volatility:['atr','bb_up','bb_lo','body_pct','range_pct'],Volume:['vol_sma'],'Opening range':['or_high','or_low'],'Volume profile':['vp_poc','vp_vah','vp_val'],'Price action':['day_open','day_high','day_low','pw_high','pw_low','prev_high','prev_low','prev_close','pd_high','pd_low','pd_close','bull_candle','bear_candle','bull_engulf','bear_engulf','hammer','shooting_star','doji','inside_bar'],Time:['hour','dow'],Value:['num']};
const OPS={'>':'is above','<':'is below',x_up:'crosses above',x_dn:'crosses below'};
const GN={entry_long:'Long entry',exit_long:'Long exit',entry_short:'Short entry',exit_short:'Short exit'};
const O=(k,x)=>k==='num'?{k,v:x}:{k,p:x},rl=(l,op,r)=>({l,op,r}),G=(...r)=>({logic:'AND',rules:r});
const base={sl_pct:1,tp_pct:2,fee_pct:0.05,capital:10000,size_pct:100,leverage:1};
const PRE={
'EMA 9/21 crossover':{direction:'both',entry_long:G(rl(O('ema',9),'x_up',O('ema',21))),entry_short:G(rl(O('ema',9),'x_dn',O('ema',21))),exit_long:G(),exit_short:G()},
'RSI mean reversion':{direction:'long',entry_long:G(rl(O('rsi',14),'x_up',O('num',30))),exit_long:G(rl(O('rsi',14),'>',O('num',60))),entry_short:G(),exit_short:G()},
'Donchian breakout':{direction:'long',entry_long:G(rl(O('close'),'>',O('hh',20))),exit_long:G(rl(O('close'),'<',O('ll',10))),entry_short:G(),exit_short:G()}};
const RF=[['sl_pct','Stop loss % (0=off)'],['tp_pct','Take profit % (0=off)'],['fee_pct','Fee % per side'],['capital','Capital'],['size_pct','Position size %'],['leverage','Leverage']];
let S,OP=[],RES=[],GR,GP,GL;
const sp=(o,p,v)=>{const a=p.split('.');gp(o,a.slice(0,-1).join('.')||'')[a.at(-1)]=v};
function gp(o,p){return p?p.split('.').reduce((a,k)=>a[k],o):o}
function usePreset(n){S={...structuredClone(base),...structuredClone(PRE[n])};OP=[];render()}
function opH(g,i,s,o){const b=`'${g}',${i},'${s}'`;return `<select onchange="setK(${b},this.value)">${Object.entries(KG).map(([g,ks])=>`<optgroup label="${g}">${ks.map(k=>`<option ${k===o.k?'selected':''}>${k}</option>`).join('')}</optgroup>`).join('')}</select>`+(KINDS[o.k]?`<input type=number step=any value="${o.k==='num'?o.v:o.p}" oninput="setV(${b},this.value)">`:'')+(KINDS[o.k]===3?`<small style="color:var(--m)">min, from</small><input type=number step=any title="start hour UTC" value="${o.q??0}" oninput="setQ(${b},this.value)"><small style="color:var(--m)">UTC h</small>`:'')}
function render(){
 $('dir').value=S.direction;
 $('R').innerHTML=RF.map(([k,l])=>`<div><label>${l}</label><input type=number step=any value="${S[k]}" oninput="S['${k}']=+this.value"></div>`).join('');
 $('R2').innerHTML=`<div><label>Stop-loss type</label><select onchange="S.sl_mode=this.value;render()"><option value=pct ${S.sl_mode!=='candle'?'selected':''}>Fixed %</option><option value=candle ${S.sl_mode==='candle'?'selected':''}>Signal candle low/high</option></select></div>`+(S.sl_mode==='candle'?`<div><label>R:R (TP = R × risk)</label><input type=number step=any value="${S.rr??1}" oninput="S.rr=+this.value"></div>`:'')+`<div><label>Entry</label><select onchange="S.entry_mode=this.value"><option value=next_open ${S.entry_mode!=='break'?'selected':''}>Next candle open</option><option value=break ${S.entry_mode==='break'?'selected':''}>Break of signal candle</option></select></div><div><label>Max trades / day (0 = off)</label><input type=number value="${S.max_trades_day||0}" oninput="S.max_trades_day=+this.value"></div><div><label><input type=checkbox ${S.stop_after_tp?'checked':''} onchange="S.stop_after_tp=this.checked" style="width:auto"> Stop for the day after a TP</label></div>`;
 $('G').innerHTML=Object.keys(GN).map(g=>`<div class=grp><div class=gh><b>${GN[g]}</b><span><select onchange="S.${g}.logic=this.value"><option ${S[g].logic==='AND'?'selected':''}>AND</option><option ${S[g].logic==='OR'?'selected':''}>OR</option></select> <button onclick="addRule('${g}')">+ rule</button></span></div>`+
  S[g].rules.map((r,i)=>`<div class=row>${opH(g,i,'l',r.l)}<select onchange="S.${g}.rules[${i}].op=this.value">${Object.entries(OPS).map(([k,v])=>`<option value="${k}" ${k===r.op?'selected':''}>${v}</option>`).join('')}</select>${opH(g,i,'r',r.r)}<button onclick="S.${g}.rules.splice(${i},1);render()">×</button></div>`).join('')+`</div>`).join('');
 renderOpt()}
function addRule(g){S[g].rules.push(rl(O('ema',9),'x_up',O('ema',21)));render()}
function setK(g,i,s,k){const o=O(k,k==='num'?30:KINDS[k]===1?14:KINDS[k]===3?30:undefined);if(KINDS[k]===3)o.q=0;S[g].rules[i][s]=o;render()}
function setQ(g,i,s,v){S[g].rules[i][s].q=+v}
function setV(g,i,s,v){const o=S[g].rules[i][s];o[o.k==='num'?'v':'p']=+v}
function cands(){const c=[];for(const g in GN)S[g].rules.forEach((r,i)=>['l','r'].forEach(s=>{const o=r[s],b=`${g}.rules.${i}.${s}`;if(KINDS[o.k]===1||KINDS[o.k]===3)c.push([b+'.p',`${GN[g]} #${i+1} ${o.k.toUpperCase()} ${KINDS[o.k]===3?'minutes':'days/period'}`]);if(KINDS[o.k]===3)c.push([b+'.q',`${GN[g]} #${i+1} ${o.k.toUpperCase()} start hour`]);if(o.k==='num')c.push([b+'.v',`${GN[g]} #${i+1} level`])}));c.push(['sl_pct','Stop loss %'],['tp_pct','Take profit %']);return c}
function addOpt(){const c=cands().filter(x=>!OP.some(p=>p.path===x[0]));if(!c.length)return;const path=c[0][0],cur=+gp(S,path)||5;
 OP.push(path.endsWith('_pct')?{path,start:.5,end:3,step:.5}:{path,start:Math.max(2,Math.round(cur/2)),end:cur*2,step:Math.max(1,Math.round(cur/5))});renderOpt()}
function renderOpt(){const c=cands();OP=OP.filter(p=>c.some(x=>x[0]===p.path));
 $('O').innerHTML=OP.map((p,i)=>`<div class=row><select onchange="OP[${i}].path=this.value">${c.map(x=>`<option value="${x[0]}" ${x[0]===p.path?'selected':''}>${x[1]}</option>`).join('')}</select>`+['start','end','step'].map(k=>`<input type=number step=any value=${p[k]} title=${k} oninput="OP[${i}].${k}=+this.value">`).join('')+`<button onclick="OP.splice(${i},1);renderOpt()">×</button></div>`).join('')}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Server error '+r.status);return j}
const req=()=>({symbol:$('sym').value,interval:$('tf').value,candles:+$('n').value,strategy:S});
const busy=t=>$('msg').textContent=t;
async function run(){busy('Fetching data & backtesting…');try{show(await post('/api/backtest',req()));busy('')}catch(e){busy('⚠ '+e.message)}}
async function opt(){if(!OP.length)return busy('Add at least one parameter to optimize');busy('Optimizing… (can take a while)');
 try{const d=await post('/api/optimize',{...req(),params:OP.map(({path,start,end,step})=>({path,start,end,step})),metric:$('met').value,min_trades:+$('mt').value});
  const lab=Object.fromEntries(cands());RES=d.results;const P=OP.map(p=>p.path);
  $('ores').innerHTML=`<h2>Optimizer — ${d.kept} of ${d.total} combos passed (top 30)</h2><div class=box><table><tr>${P.map(p=>`<th>${lab[p]}</th>`).join('')}<th>Return%</th><th>MaxDD%</th><th>Win%</th><th>PF</th><th>Sharpe</th><th>Trades</th><th></th></tr>`+
  RES.map((r,i)=>`<tr>${r.params.map(v=>`<td>${v}</td>`).join('')}<td class="${r.m.ret>=0?'pos':'neg'}">${r.m.ret}</td><td>${r.m.dd}</td><td>${r.m.win}</td><td>${r.m.pf}</td><td>${r.m.sharpe}</td><td>${r.m.trades}</td><td><button onclick="applyOpt(${i},${JSON.stringify(P).replace(/"/g,'&quot;')})">Apply</button></td></tr>`).join('')+`</table></div>`;
  if(d.grid&&d.grid.best){GR=d.grid;GP=P;GL=lab;$('ores').innerHTML+=heat(d.grid,P,lab);plot3d(d.grid.plat?'s':'z')}else if(OP.length!==2)$('ores').innerHTML+='<p style="color:var(--m)">ℹ Plateau map appears only when you optimize <b>exactly 2 parameters</b> (you used '+OP.length+').</p>';else $('ores').innerHTML+='<p style="color:var(--m)">ℹ No plateau map: no combination passed the min-trades filter. Lower “min trades” or widen the range.</p>';busy(d.kept?'Tip: re-test best results on a different period to avoid overfitting.':'No combination met the min-trades filter.')}catch(e){busy('⚠ '+e.message)}}
function applyOpt(i,P){P.forEach((p,j)=>sp(S,p,RES[i].params[j]));render();run()}
async function mc(){busy('Running Monte Carlo…');try{const d=await post('/api/montecarlo',{...req(),sims:+$('mcn').value,method:$('mcm').value});mcShow(d);busy('')}catch(e){busy('⚠ '+e.message)}}
function mcShow(d){const B=d.bands,A=d.actual,s=d.stats,W=600,H=240,P=44,n=A.length-1,all=[...B.p5,...B.p95,...A],lo=Math.min(...all),hi=Math.max(...all);
 const X=i=>P+i/n*(W-P-8),Y=v=>H-24-(v-lo)/(hi-lo||1)*(H-44),pt=(v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1),pl=a=>a.map(pt).join(' '),ar=(a,b)=>pl(a)+' '+b.map(pt).reverse().join(' ');
 const f=(v,u='%')=>`<span class="${v>=0?'pos':'neg'}">${v}${u}</span>`;
 $('mcres').innerHTML=`<h2>Monte Carlo — ${d.sims} simulations of ${d.n} trades (${d.method==='shuffle'?'shuffled order':'resampled'})</h2>
 <svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--p);border:1px solid var(--b);border-radius:8px;margin:10px 0"><polygon points="${ar(B.p5,B.p95)}" fill="rgba(59,130,246,.15)"/><polygon points="${ar(B.p25,B.p75)}" fill="rgba(59,130,246,.3)"/>
 <line x1="${P}" x2="${W-8}" y1="${Y(A[0])}" y2="${Y(A[0])}" stroke="#8b98a9" stroke-dasharray="4"/><polyline points="${pl(B.p50)}" fill="none" stroke="#3b82f6" stroke-width="2"/><polyline points="${pl(A)}" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
 <g fill="#8b98a9" font-size="11"><text x="2" y="${Y(hi)+4}">${Math.round(hi)}</text><text x="2" y="${Y(lo)+4}">${Math.round(lo)}</text><text x="${P}" y="${H-6}">Trade # (0 – ${n})</text></g></svg>
 <p style="color:var(--m);margin:0 0 8px">White = your actual result · blue = median · dark band = 25–75% · light band = 5–95% of simulations</p>
 <div class=cards>`+[['Median return',f(s.med_ret)],['5% worst / 95% best',f(s.p5_ret)+' / '+f(s.p95_ret)],['Probability of profit',s.prob_profit+'%'],['Median max DD',f(s.med_dd)],['Worst-5% max DD',f(s.worst_dd)],[`Risk of ruin (DD ≥ ${d.ruin_pct}%)`,s.ruin+'%'],['Your actual run',f(s.actual_ret)+' / DD '+f(s.actual_dd)]].map(([a,b])=>`<div class=card><small>${a}</small><b style="font-size:16px">${b}</b></div>`).join('')+'</div>'}
function heat(g,P,lab){const z=g.z.flat().filter(v=>v!==null),mn=Math.min(...z),mx=Math.max(...z),col=v=>v===null?'#1a2230':`hsl(${(v-mn)/(mx-mn||1)*120},55%,32%)`;
 let h=`<h2>Plateau map — rows: ${lab[P[0]]} · columns: ${lab[P[1]]}</h2><div class=box><table><tr><th></th>${g.ys.map(y=>`<th>${y}</th>`).join('')}</tr>`;
 g.xs.forEach((x,i)=>{h+=`<tr><th>${x}</th>`+g.ys.map((y,j)=>{const v=g.z[i][j],k=(g.best[0]===i&&g.best[1]===j?'★':'')+(g.plat&&g.plat[0]===i&&g.plat[1]===j?'◆':'');return `<td style="background:${col(v)};cursor:pointer" onclick="applyPair(${x},${y},'${P[0]}','${P[1]}')">${v===null?'–':v.toFixed(1)}${k}</td>`}).join('')+'</tr>'});
 const b=g.best,p=g.plat;
 return h+`</table></div><h2>3D plateau view</h2><div class=row><button onclick="plot3d('z')">Raw score</button><button onclick="plot3d('s')">Smoothed (plateau)</button><span style="color:var(--m);font-size:12px">drag to rotate · pinch to zoom</span></div><div id=p3d class=ch style="height:380px">Loading 3D…</div><p style="color:var(--m)">★ best single cell (${g.z[b[0]][b[1]].toFixed(2)}) at ${g.xs[b[0]]} / ${g.ys[b[1]]} — can be a lucky spike.<br>`+(p?`◆ most stable zone at ${g.xs[p[0]]} / ${g.ys[p[1]]} — its 3×3 neighbourhood averages ${g.s[p[0]][p[1]].toFixed(2)}. A wide green plateau is more trustworthy than one bright spot. Tap any cell to apply it.`:'No stable zone found (too few valid neighbours) — widen the range or lower min trades.')+'</p>'}
function applyPair(x,y,a,b){sp(S,a,x);sp(S,b,y);render();run()}
const loadPlotly=()=>window.Plotly?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js';e.onload=ok;e.onerror=()=>no(new Error('3D library failed to load (check internet)'));document.head.appendChild(e)});
async function plot3d(kind){const el=$('p3d'),g=GR;if(!el||!g)return;try{await loadPlotly()}catch(e){el.textContent='⚠ '+e.message;return}
 const M=kind==='s'?g.s:g.z,ax=t=>({title:{text:t},gridcolor:'#2a3442',zerolinecolor:'#2a3442',color:'#9aa4b2'}),met=$('met').selectedOptions[0].text;
 const T=[{type:'surface',x:g.ys,y:g.xs,z:M,colorscale:'RdYlGn',showscale:false,hovertemplate:'%{x} / %{y}<br>score %{z:.2f}<extra></extra>'}];
 const pin=(c,v,name,col,sym)=>c&&M[c[0]][c[1]]!==null&&T.push({type:'scatter3d',mode:'markers',name,x:[g.ys[c[1]]],y:[g.xs[c[0]]],z:[M[c[0]][c[1]]],marker:{size:6,color:col,symbol:sym,line:{color:'#000',width:1}},hoverinfo:'name'});
 if(kind!=='s')pin(g.best,0,'Best','#ffffff','circle');pin(g.plat,0,'Stable zone','#22d3ee','diamond');
 Plotly.newPlot(el,T,{paper_bgcolor:'rgba(0,0,0,0)',margin:{l:0,r:0,t:0,b:0},showlegend:false,font:{color:'#9aa4b2',size:10},scene:{bgcolor:'rgba(0,0,0,0)',xaxis:ax(GL[GP[1]]),yaxis:ax(GL[GP[0]]),zaxis:ax(met+(kind==='s'?' (3×3 avg)':'')),camera:{eye:{x:1.7,y:1.7,z:.9}}}},{displayModeBar:false,responsive:true})}
function say(w,t){const l=$('cl');l.insertAdjacentHTML('beforeend',`<p class=${w}><b>${w==='u'?'You':'QuantLab'}:</b> ${t.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p>`);l.scrollTop=l.scrollHeight}
async function chat(){const i=$('ci'),m=i.value.trim();if(!m)return;i.value='';say('u',m);busy('Thinking…');
 try{const d=await post('/api/chat',{message:m,strategy:S,symbol:$('sym').value,interval:$('tf').value});
  say('a',d.reply+(d.mode==='ai'?'':''));if(d.changed){S={...S,...d.strategy};if(d.symbol)$('sym').value=d.symbol;if(d.interval)$('tf').value=d.interval;OP=[];render();busy('');run()}else busy('')}
 catch(e){say('a','⚠ '+e.message);busy('')}}
const mk=el=>LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:'transparent'},textColor:'#9aa4b2'},grid:{vertLines:{color:'#1c2430'},horzLines:{color:'#1c2430'}},timeScale:{timeVisible:true},rightPriceScale:{borderColor:'#2a3442'}});
let pc,ec,cs,eqs;
function show(d){histAdd(d.metrics);const m=d.metrics,f=(v,s='')=>`<span class="${v>=0?'pos':'neg'}">${v}${s}</span>`;
 $('cards').innerHTML=[['Net return',f(m.ret,'%')],['Buy & hold',f(m.bh,'%')],['Max drawdown',f(m.dd,'%')],['Win rate',m.win+'%'],['Profit factor',m.pf],['Sharpe',m.sharpe],['Trades',m.trades,`${m.nw} wins / ${m.trades-m.nw} losses`],['Avg R:R',m.rr,`avg win ${m.aw}% · avg loss ${m.al}%`],['Avg trade',f(m.avg,'%')],['Final equity',m.final]].map(([a,b,c])=>`<div class=card><small>${a}</small><b>${b}</b>${c?`<small>${c}</small>`:''}</div>`).join('');
 eqs.applyOptions({baseValue:{type:'price',price:+S.capital||10000}});cs.setData(d.candles);eqs.setData(d.equity);
 const mk2=[];d.trades.forEach(t=>{const L=t.side==='long';mk2.push({time:t.t0,position:L?'belowBar':'aboveBar',color:'#3b82f6',shape:L?'arrowUp':'arrowDown'},{time:t.t1,position:L?'aboveBar':'belowBar',color:t.pnl>0?'#22c55e':'#ef4444',shape:'circle'})});
 cs.setMarkers(mk2.sort((a,b)=>a.time-b.time));const fit=()=>{pc.timeScale().fitContent();ec.timeScale().fitContent()};fit();setTimeout(fit,80);
 $('T').innerHTML=`<table><tr><th>#</th><th>Side</th><th>Entry time</th><th>Entry</th><th>Exit</th><th>PnL</th><th>%</th><th>Exit by</th></tr>`+d.trades.map((t,i)=>[i+1,t,t]).reverse().map(([i,t])=>`<tr><td>${i}</td><td>${t.side}</td><td>${new Date(t.t0*1000).toLocaleString()}</td><td>${t.entry.toFixed(4)}</td><td>${t.exit.toFixed(4)}</td><td class="${t.pnl>=0?'pos':'neg'}">${t.pnl.toFixed(2)}</td><td>${t.pct.toFixed(2)}</td><td>${t.why}</td></tr>`).join('')+`</table>`}
pc=mk($('pc'));ec=mk($('ec'));cs=pc.addCandlestickSeries();eqs=ec.addBaselineSeries({baseValue:{type:'price',price:10000},lineWidth:2,topLineColor:'#22c55e',topFillColor1:'rgba(34,197,94,.28)',topFillColor2:'rgba(34,197,94,.02)',bottomLineColor:'#ef4444',bottomFillColor1:'rgba(239,68,68,.02)',bottomFillColor2:'rgba(239,68,68,.28)'});
const SK='quantlab_saved',HK='quantlab_hist';let LT='tpl',LASTM=null,LASTK='';
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){busy('⚠ Browser storage full or unavailable — use Backup all')}};
const svAll=()=>rd(SK,'{}'),histAll=()=>rd(HK,'[]');
const snap=()=>({S:structuredClone(S),sym:$('sym').value,tf:$('tf').value,n:+$('n').value});
const skey=x=>JSON.stringify([x.S,x.sym,x.tf,x.n]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opn=o=>o.k==='num'?o.v:o.k.toUpperCase()+(o.p?' '+o.p:'')+(o.q!==undefined?'@'+o.q:'');
const SYM={'>':'>','<':'<',x_up:'↗',x_dn:'↘'};
function desc(s){const g=(k,t)=>s[k]&&s[k].rules.length?t+s[k].rules.map(r=>`${opn(r.l)} ${SYM[r.op]} ${opn(r.r)}`).join(s[k].logic==='OR'?' | ':' & '):'';
 return [g('entry_long','Long: '),g('entry_short','Short: '),g('exit_long','Exit L: '),g('exit_short','Exit S: ')].filter(Boolean).join('  ·  ')+(s.sl_mode==='candle'?`  ·  SL signal candle, RR ${s.rr??1}`:(s.sl_pct?`  ·  SL ${s.sl_pct}%`:'')+(s.tp_pct?` TP ${s.tp_pct}%`:''))+(s.entry_mode==='break'?'  ·  entry on break':'')+(s.stop_after_tp?'  ·  1 TP/day':'')}
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
function histAdd(m){const e={...snap(),m,t:Date.now()},a=histAll();LASTM=m;LASTK=skey(e);if(a.length&&skey(a[0])===LASTK)a[0]=e;else a.unshift(e);wr(HK,a.slice(0,100));if(LT==='hist')libRender()}
function libTab(t){LT=t;libRender()}
function libRender(){const T=svAll(),H=histAll();$('tt').className=LT==='tpl'?'on':'';$('th').className=LT==='hist'?'on':'';
 const it=(title,e,kind,i)=>{const m=e.m;return `<div class=it><b>${esc(title)}</b><div class=sub>${e.sym||''} ${e.tf||''}${m?` · <span class="${m.ret>=0?'pos':'neg'}">${m.ret}%</span> · DD ${m.dd}% · ${m.trades} trades · PF ${m.pf}`:''}${kind==='tpl'&&e.t?' · saved '+ago(e.t):''}</div><div class=sub2>${esc(desc(e.S))}</div><div class=row><button onclick="libLoad('${kind}',${i})">Load &amp; run</button>`+(kind==='hist'?`<button onclick="libStar(${i})">★ Template</button>`:`<button onclick="libRen(${i})">Rename</button>`)+`<button onclick="libDel('${kind}',${i})">Delete</button></div></div>`};
 $('lib').innerHTML=LT==='tpl'?(Object.keys(T).map((n,i)=>it(n,T[n],'tpl',i)).join('')||'<p class=sub>No templates yet. Run a backtest you like, then tap “★ Save template”.</p>'):(H.map((e,i)=>it(new Date(e.t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),e,'hist',i)).join('')||'<p class=sub>No history yet. Every backtest you run is saved here automatically.</p>')}
function svApply(d){if(!d||!d.S||!d.S.direction)throw Error('Invalid strategy file');S={...structuredClone(base),...d.S};OP=[];if(d.sym)$('sym').value=d.sym;if(d.tf)$('tf').value=d.tf;if(d.n)$('n').value=d.n;render()}
function libLoad(k,i){const e=k==='tpl'?svAll()[Object.keys(svAll())[i]]:histAll()[i];if(!e)return;try{svApply(e);busy('');run()}catch(x){busy('⚠ '+x.message)}}
function libDel(k,i){if(k==='tpl'){const a=svAll(),n=Object.keys(a)[i];if(!confirm('Delete template “'+n+'”?'))return;delete a[n];wr(SK,a)}else{const a=histAll();a.splice(i,1);wr(HK,a)}libRender()}
function tplPut(e){const n=(prompt('Template name?')||'').trim();if(!n)return;const a=svAll();if(a[n]&&!confirm('“'+n+'” already exists. Overwrite?'))return;a[n]={...e,t:Date.now()};wr(SK,a);LT='tpl';libRender();busy('Saved template “'+n+'” ⭐')}
function libStar(i){const e=histAll()[i];if(e)tplPut(e)}
function tplSave(){const e=snap();tplPut({...e,m:LASTK===skey(e)?LASTM:null})}
function libRen(i){const a=svAll(),o=Object.keys(a)[i],n=(prompt('New name?',o)||'').trim();if(!n||n===o)return;if(a[n]&&!confirm('“'+n+'” already exists. Overwrite?'))return;const r={};for(const k of Object.keys(a)){if(k===o)r[n]=a[o];else if(k!==n)r[k]=a[k]}wr(SK,r);libRender()}
function histClear(){if(confirm('Clear all history? (Templates are kept)')){wr(HK,[]);libRender()}}
const dl=(o,f)=>{const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;a.click()};
const svExport=()=>dl(snap(),'quantlab_'+$('sym').value+'.json'),svBackup=()=>dl({templates:svAll(),history:histAll()},'quantlab_backup.json');
function svImport(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.templates){wr(SK,{...svAll(),...d.templates});wr(HK,[...histAll(),...(d.history||[])].sort((a,b)=>b.t-a.t).slice(0,100));libRender();busy('Backup imported')}else{svApply(d);busy('Imported '+f.name)}}catch(e){busy('⚠ '+e.message)}};r.readAsText(f);i.value=''}
$('pre').innerHTML=Object.keys(PRE).map(k=>`<option>${k}</option>`).join('');
$('tf').innerHTML=['1m','3m','5m','15m','30m','1h','2h','4h','1d'].map(k=>`<option ${k==='1h'?'selected':''}>${k}</option>`).join('');
usePreset(Object.keys(PRE)[0]);libRender();say('a','Hi! Apni strategy words mein likho, jaise: “long when ema 9 crosses above ema 21 and rsi below 70, exit when rsi above 80, sl 1% tp 2%”. Candle patterns (hammer, bullish engulfing), previous day high/low, opening range (“15 min opening range from 13:30 utc”), volume profile (poc, vah, val), supertrend, adx, stoch, time window (between 8 and 20 utc) sab chalte hain. “new strategy” se reset.');
fetch('/api/symbols').then(r=>r.json()).then(s=>$('sy').innerHTML=s.map(x=>`<option value=${x}>`).join('')).catch(()=>{});
</script></body></html>
